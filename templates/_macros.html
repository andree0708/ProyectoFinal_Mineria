{% macro icon(nombre, clase='') -%}
<svg class="ico ico-{{ nombre }} {{ clase }}" viewBox="0 0 24 24" aria-hidden="true">
{%- if nombre == 'arrow' %}<path d="M5 12h14"/><path d="m13 6 6 6-6 6"/>
{%- elif nombre == 'chart' %}<path d="M3 3v18h18"/><path d="M7 15l4-4 3 3 5-6"/>
{%- elif nombre == 'text' %}<path d="M4 6h16"/><path d="M4 12h10"/><path d="M4 18h13"/>
{%- elif nombre == 'table' %}<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 10h18"/><path d="M9 10v10"/>
{%- elif nombre == 'flask' %}<path d="M9 3h6"/><path d="M10 3v6l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3"/>

{%- endif -%}
</svg>
{%- endmacro %}
